name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: .\build.bat
        shell: cmd

      - name: Package
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          (Get-Content .github\README_INSTALL.txt -Raw).Replace('{{VERSION}}', "v$version") | Out-File README.txt -Encoding utf8
          Compress-Archive -Path dist\*, README.txt -DestinationPath "PulseShader-$version.zip"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release create $tag "PulseShader-$version.zip" --target $env:COMMIT_SHA --title $tag --notes "" --draft
