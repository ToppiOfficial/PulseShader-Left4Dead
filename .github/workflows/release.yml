name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: .\build.bat
        shell: cmd

      - name: Package
        run: Compress-Archive -Path dist\* -DestinationPath PulseShader.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create $env:RELEASE_TAG PulseShader.zip --target $env:COMMIT_SHA --title $env:RELEASE_TAG --notes "" --draft
