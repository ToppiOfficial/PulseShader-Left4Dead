name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: .\build.bat
        shell: cmd

      - name: Package
        run: Compress-Archive -Path dist\* -DestinationPath PulseShader.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $tag = "v$((Get-Content VERSION -Raw).Trim())"
          gh release create $tag PulseShader.zip --target $env:COMMIT_SHA --title $tag --notes "" --draft
